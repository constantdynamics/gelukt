                                        data-action="switch-daypart" data-daypart="${part}"
                                        aria-pressed="${isActive}">
                                    <span class="tab__emoji">${meta.emoji}</span>
                                    <span>${meta.label.toUpperCase()}</span>
                                    ${done ? '<span class="tab__badge">✓</span>' : ''}
                                </button>
                            `;
                        }).join('')}
                    </nav>
                `;
            }

            renderDayPartProgress(part) {
                const tasks = this.tasks[part];
                if (tasks.length === 0) return '';

                const done = tasks.filter(task => task.completed).length;
                const percent = Math.round((done / tasks.length) * 100);
                const allDone = done === tasks.length;

                return `
                    <section class="dp-progress">
                        <div class="dp-progress__top">
                            <span class="dp-progress__label">${allDone ? 'Helemaal klaar! 🎉' : 'Nog even doorgaan…'}</span>
                            <span class="dp-progress__count">${done}/${tasks.length}</span>
                        </div>
                        <div class="dp-progress__track">
                            <div class="dp-progress__fill" style="width:${percent}%"></div>
                        </div>
                    </section>
                `;
            }

            renderTasksGrid(tasks) {
                return `<div class="grid">${tasks.map(task => this.renderTaskCircle(task)).join('')}</div>`;
            }

            renderTaskCircle(task) {
                const done = task.completed;
                const check = `
                    <span class="orb__check" aria-hidden="true">
                        <svg viewBox="0 0 100 100"><path d="M22 52 L42 72 L78 30"/></svg>
                    </span>`;

                return `
                    <button class="task ${done ? 'task--done' : ''}"
                            data-action="task-click" data-daypart="${this.activeDayPart}" data-task="${task.id}"
                            aria-label="${escapeHtml(task.name)}${done ? ' — voltooid' : ''}">
                        <span class="orb ${done ? 'orb--done' : ''}" data-orb="${task.id}">
                            <span aria-hidden="true">${escapeHtml(task.emoji)}</span>
                            ${done ? check : ''}
                        </span>
                        <span class="task__name">${escapeHtml(task.name)}</span>
                    </button>
                `;
            }

            renderEmptyDayPart(part) {
                const meta = DAY_PART_META[part];
                return `
                    <div class="empty">
                        <div class="empty__art">${meta.emoji}</div>
                        <div class="empty__title">Geen taken voor de ${meta.label.toLowerCase()}</div>
                        <div class="empty__text">Dit dagdeel telt gewoon mee als klaar.</div>
                    </div>
                `;
            }

            renderEmptyState() {
                return `
                    <div class="empty">
                        <div class="empty__art">🎯</div>
                        <div class="empty__title">Nog geen taken!</div>
                        <div class="empty__text">Laat je ouder taken toevoegen<br>via het tandwiel ⚙️ rechtsboven.</div>
                    </div>
                `;
            }

            renderMiniTrain() {
                const completed = this.getCompletedDates();
                const todayDone = this.getDayEntry(this.todayKey()).completed;
                const recent = completed.slice(-6);
                const cars = recent.map(() => '<span class="minitrain__car minitrain__car--done"></span>');

                while (cars.length < 6) {
                    const isNext = cars.length === recent.length;
                    cars.push(`<span class="minitrain__car ${isNext && !todayDone ? 'minitrain__car--today' : ''}"></span>`);
                }

                return `
                    <button class="minitrain" data-action="open-train" aria-label="Trein voortgang bekijken">
                        <span class="minitrain__loco">🚂</span>
                        <span class="minitrain__cars">${cars.join('')}</span>
                        <span class="minitrain__count">${completed.length}</span>
                    </button>
                `;
            }

            /** The growing train, wrapped 7 wagons per row (keuze 2b). */
            renderTrain({ interactive = true } = {}) {
                const completed = this.getCompletedDates();
                const todayKey = this.todayKey();
                const todayDone = this.getDayEntry(todayKey).completed;
                const hasTasks = this.totalTaskCount() > 0;

                const wagons = completed.map((key, index) => ({ key, index, done: true }));
                if (!todayDone && hasTasks) wagons.push({ key: todayKey, index: wagons.length, done: false });

                if (wagons.length === 0) {
                    return `
                        <div class="train">
                            <div class="train__row"><span class="loco">🚂</span></div>
                            <p class="helper">Nog geen wagons. Maak een hele dag af en de eerste wagon komt eraan!</p>
                        </div>`;
                }

                const rows = [];
                for (let i = 0; i < wagons.length; i += 7) rows.push(wagons.slice(i, i + 7));

                return `
                    <div class="train">
                        ${rows.map((row, rowIndex) => `
                            <div class="train__row">
                                ${rowIndex === 0 ? '<span class="loco">🚂</span>' : '<span class="loco" style="opacity:.25">⋯</span>'}
                                ${row.map(wagon => this.renderWagon(wagon, interactive)).join('')}
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            renderWagon(wagon, interactive) {
                const isNew = wagon.done && wagon.index === this.previousTrainLength - 1;
                const classes = [
                    'wagon',
                    wagon.done ? 'wagon--done' : 'wagon--today',
                    isNew ? 'wagon--new' : ''
                ].filter(Boolean).join(' ');

                const date = new Date(`${wagon.key}T00:00:00`);
                const label = `${DAY_NAMES_SHORT[(date.getDay() === 0 ? 7 : date.getDay()) - 1]} ${date.getDate()}/${date.getMonth() + 1}`;

                return `
                    <button class="${classes}"
                            ${interactive ? `data-action="day-detail" data-day="${wagon.key}"` : 'disabled'}
                            aria-label="${label}${wagon.done ? ' — voltooid' : ' — vandaag'}">
                        <span class="wagon__art" aria-hidden="true">${wagon.done ? '🚃' : '⏳'}</span>
                        <span class="wagon__num">${wagon.index + 1}</span>
                        ${wagon.done ? '<span class="wagon__star" aria-hidden="true">✨</span>' : ''}
                    </button>
                `;
            }

            // ---- Parent mode -------------------------------------------------

            renderParentMode() {
                return `
                    <header class="p-head">
                        <button class="p-head__back" data-action="open-child">← Terug</button>
                        <div class="p-head__title">Ouder-modus</div>
                        <div class="p-head__spacer"></div>
                    </header>

                    <nav class="segmented">
                        <button class="segmented__item ${this.parentTab === 'manage' ? 'is-active' : ''}"
                                data-action="parent-tab" data-tab="manage">Taken beheren</button>
                        <button class="segmented__item ${this.parentTab === 'progress' ? 'is-active' : ''}"
                                data-action="parent-tab" data-tab="progress">Voortgang</button>
                    </nav>

                    <div class="p-body">
                        ${this.parentTab === 'manage' ? this.renderManageTab() : this.renderProgressTab()}
                    </div>
                `;
            }

            renderManageTab() {
                return `
                    ${this.renderChildCard()}
                    ${this.renderTemplateCard()}
                    ${this.renderCurrentTasksCard()}
                    ${this.renderResetCard()}
                `;
            }

            renderChildCard() {
                return `
                    <section class="card">
                        <h2 class="card__title">👶 Kind</h2>
                        <p class="card__hint">Naam en avatar zoals je kind ze in de app ziet.</p>

                        <div class="field">
                            <label class="field__label" for="profile-name">Naam</label>
                            <input class="input" id="profile-name" type="text" maxlength="24"
                                   value="${escapeHtml(this.profile.name)}"
                                   data-action="profile-name" placeholder="Naam van je kind">
                        </div>

                        <div class="field">
                            <span class="field__label">Avatar</span>
                            <div class="avatar-grid">
                                ${AVATARS.map(emoji => `
                                    <button class="avatar-opt ${this.profile.avatar === emoji ? 'is-active' : ''}"
                                            data-action="profile-avatar" data-avatar="${emoji}"
                                            aria-label="Avatar ${emoji}">${emoji}</button>
                                `).join('')}
                            </div>
                        </div>
                    </section>
                `;
            }

            /** Keuze 4a: every template can go to any daypart. */
            renderTemplateCard() {
                const target = this.templateDayPart;

                return `
                    <section class="card">
                        <h2 class="card__title">➕ Taak toevoegen</h2>
                        <p class="card__hint">Kies eerst een dagdeel, tik dan op een taak. Een ⭐ betekent: aanbevolen voor dit dagdeel.</p>

                        <div class="chiprow">
                            ${DAY_PARTS.map(part => `
                                <button class="chip chip--${part} ${target === part ? 'is-active' : ''}"
                                        data-action="template-daypart" data-daypart="${part}">
                                    ${DAY_PART_META[part].emoji} ${DAY_PART_META[part].label}
                                </button>
                            `).join('')}
                        </div>

                        <div class="tpl-grid">
                            ${TASK_TEMPLATES.map((template, index) => `
                                <button class="tpl" data-action="add-template" data-template="${index}">
                                    ${template.dayPart === target ? '<span class="tpl__rec" title="Aanbevolen">⭐</span>' : ''}
                                    <span class="tpl__emoji">${template.emoji}</span>
                                    <span class="tpl__name">${escapeHtml(template.name)}</span>
                                </button>
                            `).join('')}
                        </div>
                    </section>
                `;
            }

            renderCurrentTasksCard() {
                const rows = DAY_PARTS.flatMap(part =>
                    this.tasks[part].map(task => ({ task, part }))
                );

                return `
                    <section class="card">
                        <h2 class="card__title">📋 Huidige taken</h2>
                        <p class="card__hint">${rows.length} ${rows.length === 1 ? 'taak' : 'taken'} in totaal.</p>

                        ${rows.length === 0
                            ? '<p class="helper">Nog geen taken toegevoegd.</p>'
                            : `<div class="tasklist">
                                ${rows.map(({ task, part }) => `
                                    <div class="trow">
                                        <span class="trow__emoji">${escapeHtml(task.emoji)}</span>
                                        <div class="trow__body">
                                            <div class="trow__name">${escapeHtml(task.name)}</div>
                                            <div class="trow__meta">
                                                <span>${DAY_PART_META[part].emoji} ${DAY_PART_META[part].label}</span>
                                                <span class="trow__word">${escapeHtml(task.verifyWord)}</span>
                                                <span>${this.animationLabel(task.animation)}</span>
                                                <span>${this.soundLabel(task.sound)}</span>
                                            </div>
                                        </div>
                                        <div class="trow__actions">
                                            <button class="iconbtn" data-action="edit-task"
                                                    data-daypart="${part}" data-task="${task.id}"
                                                    aria-label="${escapeHtml(task.name)} bewerken">✏️</button>
                                            <button class="iconbtn iconbtn--danger" data-action="delete-task"
                                                    data-daypart="${part}" data-task="${task.id}"
                                                    aria-label="${escapeHtml(task.name)} verwijderen">🗑️</button>
                                        </div>
                                    </div>
                                `).join('')}
                               </div>`}
                    </section>
                `;
            }

            renderResetCard() {
                return `
                    <section class="card">
                        <h2 class="card__title">🔄 Opnieuw beginnen</h2>
                        <p class="card__hint">
                            Taken resetten elke nacht automatisch om 00:00.
                            Gebruik deze knoppen als je eerder opnieuw wilt starten.
                        </p>

                        <button class="btn btn--danger btn--lg" data-action="reset-today">🔄 Reset vandaag</button>
                        <div class="divider"></div>
                        <button class="btn btn--outline" data-action="reset-train">🚂 Hele trein resetten</button>
                        <p class="helper">Reset vandaag wist alleen de vinkjes van vandaag. De trein resetten wist alle wagons.</p>
                    </section>
                `;
            }

            renderProgressTab() {
                const total = this.getCompletedDates().length;
                const week = this.getWeekCompletedCount();

                return `
                    <section class="card">
                        <h2 class="card__title">🚂 De trein</h2>
                        <p class="card__hint">Elke volledig afgeronde dag is een wagon. De trein blijft groeien.</p>
                        ${this.renderTrain()}
                    </section>

                    <section class="card">
                        <h2 class="card__title">📅 Deze week</h2>
                        <p class="card__hint">Per dag zie je of ochtend, middag en avond klaar zijn.</p>
                        ${this.renderWeekOverview()}
                    </section>

                    <div class="stat">
                        <div class="stat__art">${total === 0 ? '🎯' : (week === 7 ? '🏆' : '🎉')}</div>
                        <div class="stat__big">${total} ${total === 1 ? 'dag' : 'dagen'} voltooid!</div>
                        <div class="stat__sub">Deze week: ${week} / 7 dagen</div>
                    </div>
                `;
            }

            renderWeekOverview() {
                return `
                    <div class="week">
                        ${this.getCurrentWeekDays().map(day => {
                            const classes = [
                                'wday',
                                day.entry.completed ? 'wday--done' : '',
                                day.isToday ? 'wday--today' : ''
                            ].filter(Boolean).join(' ');

                            return `
                                <div class="${classes}">
                                    <span class="wday__name">${day.label}</span>
                                    <span class="wday__dots">
                                        ${DAY_PARTS.map(part => `
                                            <span class="dot ${day.entry[part] ? 'is-on' : ''}"
                                                  title="${DAY_PART_META[part].label}">${DAY_PART_META[part].emoji}</span>
                                        `).join('')}
                                    </span>
                                    ${day.entry.completed
                                        ? '<span class="wday__mark">🏆</span>'
                                        : (day.isToday ? '<span class="wday__tag">VANDAAG</span>'
                                                       : (day.isFuture ? '<span class="wday__tag">—</span>' : ''))}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            animationLabel(id) {
                const found = ANIMATIONS.find(item => item.id === id);
                return found ? found.label : id;
            }

            soundLabel(id) {
                const found = SOUNDS.find(item => item.id === id);
                return found ? found.label : id;
            }

            // ================================================================
            // MODALS
            // ================================================================

            openModal(html, { wide = false, onMount } = {}) {
                this.closeModal();

                const overlay = document.createElement('div');
                overlay.className = 'overlay';
                overlay.innerHTML = `<div class="modal ${wide ? 'modal--wide' : ''}">${html}</div>`;

                overlay.addEventListener('click', event => {
                    if (event.target === overlay) this.closeModal();
                });

                document.body.appendChild(overlay);
                if (onMount) onMount(overlay);
                return overlay;
            }

            closeModal() {
                const overlay = document.querySelector('.overlay');
                if (!overlay) return;

                this.stopRecording({ discard: true });
                overlay.classList.add('overlay--closing');
                setTimeout(() => overlay.remove(), 180);
            }

            showVerificationModal(dayPart, taskId) {
                const task = this.findTask(dayPart, taskId);
                if (!task) return;

                const body = task.completed
                    ? `
                        <div class="donebadge">✓ Deze taak is al gelukt!</div>
                        <button class="btn btn--warn" data-action="show-undo">Ongedaan maken (typ UNDO)</button>
                        <div id="undo-panel" hidden style="margin-top:12px">
                            <input class="verify-input" id="undo-input" type="text"
                                   placeholder="UNDO" autocomplete="off" autocorrect="off"
                                   autocapitalize="characters" spellcheck="false" enterkeyhint="done">
                            <div class="modal__actions">
                                <button class="btn btn--ghost" data-action="close-modal">Annuleren</button>
                                <button class="btn btn--danger" data-action="confirm-undo"
                                        data-daypart="${dayPart}" data-task="${taskId}">Bevestig</button>
                            </div>
                        </div>
                        <div class="modal__actions">
                            <button class="btn btn--ghost" data-action="close-modal">Sluiten</button>
                        </div>`
                    : `
                        <div class="wordbox">
                            <div class="wordbox__label">Typ het woord</div>
                            <div class="wordbox__word">${escapeHtml(task.verifyWord)}</div>
                        </div>
                        <input class="verify-input" id="verify-input" type="text"
                               placeholder="…" autocomplete="off" autocorrect="off"
                               autocapitalize="characters" spellcheck="false" enterkeyhint="done">
                        <div class="modal__actions">
                            <button class="btn btn--ghost" data-action="close-modal">Annuleren</button>
                            <button class="btn btn--success" data-action="verify-task"
                                    data-daypart="${dayPart}" data-task="${taskId}">Controleren ✓</button>
                        </div>
                        <p class="helper">Geef het toestel aan papa of mama om af te vinken.</p>`;

                this.openModal(`
                    <div class="modal__emoji">${escapeHtml(task.emoji)}</div>
                    <h2 class="modal__title">${escapeHtml(task.name)}</h2>
                    ${body}
                `, {
                    onMount: overlay => {
                        const input = overlay.querySelector('#verify-input');
                        if (!input) return;

                        // Bug fix vs. v1: the Enter listener is bound to the live modal node.
                        input.addEventListener('keydown', event => {
                            if (event.key === 'Enter') {
                                event.preventDefault();
                                this.verifyTask(dayPart, taskId);
                            }
                        });
                        setTimeout(() => input.focus(), 120);
                    }
                });
            }

            showEditTaskModal(dayPart, taskId) {
                const task = this.findTask(dayPart, taskId);
                if (!task) return;

                this.pendingRecording = null;

                this.openModal(`
                    <h2 class="modal__h">Taak bewerken</h2>
                    <p class="card__hint">${escapeHtml(task.emoji)} ${escapeHtml(task.name)} — ${DAY_PART_META[dayPart].label}</p>

                    <div class="field">
                        <label class="field__label" for="edit-word">Verificatie woord</label>
                        <input class="input input--word" id="edit-word" type="text"
                               value="${escapeHtml(task.verifyWord)}" maxlength="24"
                               autocapitalize="characters" spellcheck="false" placeholder="WOORD">
                    </div>

                    <div class="field">
                        <label class="field__label" for="edit-animation">Animatie</label>
                        <select class="select" id="edit-animation">
                            ${ANIMATIONS.map(item => `
                                <option value="${item.id}" ${task.animation === item.id ? 'selected' : ''}>${item.label}</option>
                            `).join('')}
                        </select>
                    </div>

                    <div class="field">
                        <label class="field__label" for="edit-sound">Geluid</label>
                        <select class="select" id="edit-sound">
                            ${SOUNDS.map(item => `
                                <option value="${item.id}" ${task.sound === item.id ? 'selected' : ''}>${item.label}</option>
                            `).join('')}
                        </select>
                        <div class="btn-row" style="margin-top:10px">
                            <button class="btn btn--ghost" data-action="preview-sound"
                                    data-daypart="${dayPart}" data-task="${taskId}">▶︎ Beluisteren</button>
                        </div>
                    </div>

                    <div id="rec-panel" ${task.sound === 'custom' ? '' : 'hidden'}>
                        ${this.renderRecorderPanel(task)}
                    </div>

                    <div class="modal__actions">
                        <button class="btn btn--ghost" data-action="close-modal">Annuleren</button>
                        <button class="btn btn--primary" data-action="save-task-edit"
                                data-daypart="${dayPart}" data-task="${taskId}">Opslaan</button>
                    </div>
                `, {
                    onMount: overlay => {
                        const select = overlay.querySelector('#edit-sound');
                        const panel = overlay.querySelector('#rec-panel');
                        select.addEventListener('change', () => {
                            panel.hidden = select.value !== 'custom';
                        });
                    }
                });
            }

            /** Keuze 6b + 6e: a parent can record their own voice, per individual task. */
            renderRecorderPanel(task) {
                const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
                    && typeof window.MediaRecorder !== 'undefined'
                    && AudioStore.supported();

                if (!canRecord) {
                    return `
                        <div class="rec">
                            <div class="rec__status">🎤 Opnemen niet beschikbaar</div>
                            <p class="rec__hint">
                                Dit apparaat of deze browser ondersteunt opnemen niet.
                                Kies een van de standaardgeluiden.
                            </p>
                        </div>`;
                }

                const hasClip = !!task.customAudioId;

                return `
                    <div class="rec">
                        <div class="rec__row">
                            <button class="rec__btn" id="rec-toggle" data-action="toggle-recording"
                                    aria-label="Opname starten">🎤</button>
                            <div class="rec__info">
                                <div class="rec__status" id="rec-status">
                                    ${hasClip ? 'Er staat al een opname klaar' : 'Nog geen opname'}
                                </div>
                                <p class="rec__hint">
                                    Tik en zeg bijvoorbeeld “Gelukt!”. Maximaal 5 seconden.
                                    Elke taak heeft een eigen opname.
                                </p>
                                <div class="rec__meter"><span id="rec-meter"></span></div>
                            </div>
                        </div>
                        <div class="rec__tools">
                            <button class="btn btn--ghost" data-action="play-recording"
                                    id="rec-play" ${hasClip ? '' : 'disabled'}>▶︎ Afspelen</button>
                            <button class="btn btn--ghost" data-action="clear-recording"
                                    id="rec-clear" ${hasClip ? '' : 'disabled'}>🗑️ Wissen</button>
                        </div>
                    </div>`;
            }

            showTrainModal() {
                const total = this.getCompletedDates().length;
                const week = this.getWeekCompletedCount();

                this.openModal(`
                    <h2 class="modal__title">Jouw trein 🚂</h2>
                    <p class="modal__sub">${total} ${total === 1 ? 'dag' : 'dagen'} helemaal gelukt${week > 0 ? ` · ${week}/7 deze week` : ''}</p>
                    <div style="margin:20px 0 8px">${this.renderTrain()}</div>
                    <div class="modal__actions">
                        <button class="btn btn--primary" data-action="close-modal">Sluiten</button>
                    </div>
                `, { wide: true });
            }

            showDayDetailModal(key) {
                const entry = this.getDayEntry(key);
                const date = new Date(`${key}T00:00:00`);
                const weekdayIndex = (date.getDay() === 0 ? 7 : date.getDay()) - 1;
                const isToday = key === this.todayKey();

                this.openModal(`
                    <h2 class="modal__title">${DAY_NAMES_LONG[weekdayIndex]}</h2>
                    <p class="modal__sub">${date.getDate()} ${['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'][date.getMonth()]}${isToday ? ' · vandaag' : ''}</p>

                    <div style="margin:20px 0;display:flex;flex-direction:column;gap:9px">
                        ${DAY_PARTS.map(part => {
                            const meta = DAY_PART_META[part];
                            const done = entry[part];
                            return `
                                <div class="wday ${done ? 'wday--done' : ''}">
                                    <span style="font-size:24px">${meta.emoji}</span>
                                    <span style="font-weight:800;font-size:15px">${meta.label}</span>
                                    <span class="wday__mark">${done ? '✅' : '⚪️'}</span>
                                </div>`;
                        }).join('')}
                    </div>

                    ${entry.completed ? '<div class="donebadge">✨ Hele dag voltooid!</div>' : ''}

                    <div class="modal__actions">
                        <button class="btn btn--primary" data-action="close-modal">Sluiten</button>
                    </div>
                `);
            }

            showMilestoneModal(total) {
                this.openModal(`
                    <div class="celebrate" style="margin:-26px -22px;padding:32px 24px;border-radius:var(--r-xl)">
                        <div class="celebrate__art">🏆</div>
                        <h2 class="modal__title">SUPER GOED GEDAAN!</h2>
                        <div class="celebrate__line">${total} dagen achter elkaar gelukt! 🎉</div>
                        <div class="celebrate__train">🚂${'🚃'.repeat(Math.min(7, total))}</div>
                        <div style="margin-top:18px">
                            <button class="btn" style="background:#fff;color:#C2410C" data-action="close-modal">Hoera! 🎉</button>
                        </div>
                    </div>
                `);

                this.playAnimation('fireworks');
                this.playSound('hoera');
            }

            showConfirmModal({ title, text, confirmLabel, action }) {
                this.openModal(`
                    <h2 class="modal__h">${escapeHtml(title)}</h2>
                    <p class="card__hint">${escapeHtml(text)}</p>
                    <div class="modal__actions">
                        <button class="btn btn--ghost" data-action="close-modal">Annuleren</button>
                        <button class="btn btn--danger" data-action="${action}">${escapeHtml(confirmLabel)}</button>
                    </div>
                `);
            }

            // ================================================================
            // TOASTS
            // ================================================================

            toast(message, variant = 'info') {
                const icons = { success: '✅', error: '⚠️', party: '🎉', info: 'ℹ️' };
                const host = document.getElementById('toasts');

                // Never let a burst of messages bury the screen behind them.
                while (host.children.length >= 2) host.firstElementChild.remove();

                const element = document.createElement('div');
                element.className = `toast toast--${variant}`;
                element.innerHTML = `<span class="toast__icon">${icons[variant] || icons.info}</span><span>${escapeHtml(message)}</span>`;
                host.appendChild(element);

                setTimeout(() => {
                    element.classList.add('toast--out');
                    setTimeout(() => element.remove(), 250);
                }, variant === 'error' ? 3200 : 2600);
            }

            // ================================================================
            // EVENT HANDLERS
            // ================================================================

            bindGlobalEvents() {
                document.addEventListener('click', event => {
                    const target = event.target.closest('[data-action]');
                    if (!target) return;
                    this.handleAction(target.dataset.action, target.dataset, event);
                });

                document.addEventListener('input', event => {
                    if (event.target.dataset.action === 'profile-name') {
                        this.profile.name = event.target.value.trim() || 'Kind';
                        this.saveProfile();
                    }
                });

                document.addEventListener('keydown', event => {
                    if (event.key === 'Escape') this.closeModal();
                });
            }

            handleAction(action, data, event) {
                switch (action) {
                    case 'open-parent':
                        this.mode = 'parent';
                        this.parentTab = 'manage';
                        return this.render();

                    case 'open-child':
                        this.mode = 'child';
                        return this.render();

                    case 'parent-tab':
                        this.parentTab = data.tab;
                        return this.render();

                    case 'switch-daypart':
                        this.activeDayPart = data.daypart;
                        this.dayPartPinned = data.daypart !== this.detectDayPart();
                        return this.render();

                    case 'task-click':
                        return this.showVerificationModal(data.daypart, data.task);

                    case 'verify-task':
                        return this.verifyTask(data.daypart, data.task);

                    case 'show-undo': {
                        const panel = document.getElementById('undo-panel');
                        if (panel) {
                            panel.hidden = false;
                            event.target.hidden = true;
                            const input = document.getElementById('undo-input');
                            if (input) input.focus();
                        }
                        return;
                    }

                    case 'confirm-undo':
                        return this.confirmUndo(data.daypart, data.task);

                    case 'open-train':
                        return this.showTrainModal();

                    case 'day-detail':
                        return this.showDayDetailModal(data.day);

                    case 'template-daypart':
                        this.templateDayPart = data.daypart;
                        return this.render();

                    case 'add-template':
                        return this.addTask(Number(data.template), this.templateDayPart);

                    case 'edit-task':
                        return this.showEditTaskModal(data.daypart, data.task);

                    case 'delete-task':
                        return this.removeTask(data.daypart, data.task);

                    case 'save-task-edit':
                        return this.saveTaskEdit(data.daypart, data.task);

                    case 'preview-sound':
                        return this.previewSound(data.daypart, data.task);

                    case 'profile-avatar':
                        this.profile.avatar = data.avatar;
                        this.saveProfile();
                        return this.render();

                    case 'reset-today':
                        return this.resetToday();

                    case 'reset-train':
                        return this.showConfirmModal({
                            title: 'Hele trein resetten?',
                            text: 'Alle wagons verdwijnen en de teller begint weer bij 0. Je taken blijven gewoon staan.',
                            confirmLabel: 'Ja, resetten',
                            action: 'confirm-reset-train'
                        });

                    case 'confirm-reset-train':
                        this.closeModal();
                        return this.resetTrain();

                    case 'toggle-recording':
                        return this.toggleRecording();

                    case 'play-recording':
                        return this.playPendingOrStored();

                    case 'clear-recording':
                        return this.clearRecording();

                    case 'close-modal':
                        return this.closeModal();
                }
            }

            verifyTask(dayPart, taskId) {
                const task = this.findTask(dayPart, taskId);
                const input = document.getElementById('verify-input');
                if (!task || !input) return;

                // §6.1: case-insensitive, so TANDEN = tanden = TaNdEn.
                const entered = input.value.trim().toUpperCase();
                const expected = task.verifyWord.trim().toUpperCase();

                if (entered === expected) {
                    this.closeModal();
                    this.setTaskCompleted(dayPart, taskId, true);
                    return;
                }

                input.classList.add('is-wrong');
                input.value = '';
                input.focus();
                setTimeout(() => input.classList.remove('is-wrong'), 500);
                this.toast('Onjuist woord! Probeer opnieuw.', 'error');
            }

            confirmUndo(dayPart, taskId) {
                const input = document.getElementById('undo-input');
                if (!input) return;

                if (input.value.trim().toUpperCase() === 'UNDO') {
                    this.closeModal();
                    this.setTaskCompleted(dayPart, taskId, false);
                    this.toast('Taak staat weer open', 'info');
                    return;
                }

                input.classList.add('is-wrong');
                input.value = '';
                input.focus();
                setTimeout(() => input.classList.remove('is-wrong'), 500);
                this.toast('Typ UNDO om deze taak ongedaan te maken', 'error');
            }

            previewSound(dayPart, taskId) {
                const select = document.getElementById('edit-sound');
                const choice = select ? select.value : 'pling';

                if (choice === 'custom') {
                    if (this.pendingRecording) {
                        this.playBlob(this.pendingRecording);
                    } else {
                        this.playCustomSound(this.findTask(dayPart, taskId));
                    }
                    return;
                }
                this.playSound(choice);
            }

            saveTaskEdit(dayPart, taskId) {
                const task = this.findTask(dayPart, taskId);
                if (!task) return;

                const word = document.getElementById('edit-word').value.trim().toUpperCase();
                const animation = document.getElementById('edit-animation').value;
                const sound = document.getElementById('edit-sound').value;

                if (!word) {
                    this.toast('Verificatie woord mag niet leeg zijn', 'error');
                    return;
                }

                const updates = { verifyWord: word, animation, sound };
                const finish = () => {
                    this.updateTask(dayPart, taskId, updates);
                    this.closeModal();
                    this.toast('Taak opgeslagen', 'success');
                };

                if (sound === 'custom' && this.pendingRecording) {
                    const clipId = task.customAudioId || `clip-${taskId}`;
                    AudioStore.put(clipId, this.pendingRecording)
                        .then(() => { updates.customAudioId = clipId; this.pendingRecording = null; finish(); })
                        .catch(() => {
                            this.toast('Opname kon niet worden opgeslagen', 'error');
                            updates.sound = 'pling';
                            finish();
                        });
                    return;
                }

                if (sound === 'custom' && !task.customAudioId) {
                    this.toast('Neem eerst iets op, of kies een ander geluid', 'error');
                    return;
                }

                finish();
            }

            // ---- Recording ---------------------------------------------------

            toggleRecording() {
                if (this.recorder && this.recorder.state === 'recording') {
                    this.stopRecording();
                    return;
                }
                this.startRecording();
            }

            startRecording() {
                if (!navigator.mediaDevices || typeof window.MediaRecorder === 'undefined') {
                    this.toast('Opnemen wordt hier niet ondersteund', 'error');
                    return;
                }

                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        const mimeType = ['audio/webm', 'audio/mp4', 'audio/ogg']
                            .find(type => window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported(type));

                        const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
                        const chunks = [];

                        recorder.addEventListener('dataavailable', event => {
                            if (event.data && event.data.size > 0) chunks.push(event.data);
                        });

                        recorder.addEventListener('stop', () => {
                            stream.getTracks().forEach(track => track.stop());
                            clearInterval(this.recorderTimer);

                            if (!this.recorderDiscarded && chunks.length > 0) {
                                this.pendingRecording = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
                                this.setRecorderUI({ status: 'Opname klaar ✓', recording: false, hasClip: true, meter: 100 });
                                this.toast('Opname gelukt! Vergeet niet op te slaan.', 'success');
                            } else {
                                this.setRecorderUI({ status: 'Opname geannuleerd', recording: false, meter: 0 });
                            }
                            this.recorder = null;
                        });

                        this.recorder = recorder;
                        this.recorderDiscarded = false;
                        recorder.start();

                        const startedAt = Date.now();
                        this.setRecorderUI({ status: 'Opnemen… tik om te stoppen', recording: true, meter: 0 });

                        this.recorderTimer = setInterval(() => {
                            const elapsed = Date.now() - startedAt;
                            this.setRecorderUI({ meter: Math.min(100, (elapsed / MAX_RECORDING_MS) * 100) });
                            if (elapsed >= MAX_RECORDING_MS) this.stopRecording();
                        }, 100);
                    })
                    .catch(() => {
                        this.toast('Geen toegang tot de microfoon', 'error');
                        this.setRecorderUI({ status: 'Microfoon geweigerd', recording: false });
                    });
            }

            stopRecording({ discard = false } = {}) {
                if (!this.recorder || this.recorder.state !== 'recording') return;
                this.recorderDiscarded = discard;
                this.recorder.stop();
            }

            setRecorderUI({ status, recording, hasClip, meter }) {
                const statusEl = document.getElementById('rec-status');
                const toggleEl = document.getElementById('rec-toggle');
                const meterEl = document.getElementById('rec-meter');
                const playEl = document.getElementById('rec-play');
                const clearEl = document.getElementById('rec-clear');

                if (statusEl && status) statusEl.textContent = status;
                if (meterEl && typeof meter === 'number') meterEl.style.width = `${meter}%`;
                if (toggleEl && typeof recording === 'boolean') {
                    toggleEl.classList.toggle('is-recording', recording);
                    toggleEl.textContent = recording ? '⏹' : '🎤';
                }
                if (hasClip) {
                    if (playEl) playEl.disabled = false;
                    if (clearEl) clearEl.disabled = false;
                }
            }

            playBlob(blob) {
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                audio.addEventListener('ended', () => URL.revokeObjectURL(url));
                audio.play().catch(() => {
                    URL.revokeObjectURL(url);
                    this.toast('Kon de opname niet afspelen', 'error');
                });
            }

            playPendingOrStored() {
                if (this.pendingRecording) { this.playBlob(this.pendingRecording); return; }

                const overlay = document.querySelector('.overlay');
                const saveButton = overlay && overlay.querySelector('[data-action="save-task-edit"]');
                if (!saveButton) return;

                const task = this.findTask(saveButton.dataset.daypart, saveButton.dataset.task);
                this.playCustomSound(task);
            }

            clearRecording() {
                this.pendingRecording = null;

                const overlay = document.querySelector('.overlay');
                const saveButton = overlay && overlay.querySelector('[data-action="save-task-edit"]');
                if (saveButton) {
                    const task = this.findTask(saveButton.dataset.daypart, saveButton.dataset.task);
                    if (task && task.customAudioId) {
                        AudioStore.remove(task.customAudioId).catch(() => { /* best effort */ });
                        this.updateTaskQuietly(saveButton.dataset.daypart, saveButton.dataset.task, { customAudioId: null });
                    }
                }

                this.setRecorderUI({ status: 'Nog geen opname', recording: false, meter: 0 });
                const playEl = document.getElementById('rec-play');
                const clearEl = document.getElementById('rec-clear');
                if (playEl) playEl.disabled = true;
                if (clearEl) clearEl.disabled = true;
                this.toast('Opname gewist', 'info');
            }

            /** Update without re-rendering — used while a modal is open. */
            updateTaskQuietly(dayPart, taskId, updates) {
                const task = this.findTask(dayPart, taskId);
                if (!task) return;
                Object.assign(task, updates);
                this.saveTasks();
            }
        }

        // ====================================================================
        // INITIALIZE APP
        // ====================================================================

        let app;

        window.addEventListener('DOMContentLoaded', () => {
            app = new HabitTrackerApp();
            window.app = app;
        });

        // Prevent pinch zoom and double-tap zoom — the UI is already finger-sized.
        document.addEventListener('touchmove', event => {
            if (event.touches.length > 1) event.preventDefault();
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', event => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) event.preventDefault();
            lastTouchEnd = now;
        }, false);

        // ====================================================================
        // SERVICE WORKER REGISTRATION (PWA)
        // ====================================================================

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            if (!newWorker) return;

                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    if (confirm('Er is een nieuwe versie beschikbaar! Wil je de app verversen?')) {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                    }
                                }
                            });
                        });
                    })
                    .catch(error => console.log('Service Worker registration failed:', error));

                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) { refreshing = true; window.location.reload(); }
                });
            });
        }
    </script>
</body>
</html>
