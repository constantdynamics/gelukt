<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kids Habit Tracker</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Positief gedrag tracker voor peuters met een leuke trein visualisatie">
    <meta name="theme-color" content="#7C3AED">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Habit Tracker">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="color-scheme" content="light">

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="icon-192.svg">
    <link rel="apple-touch-icon" href="icon-192.svg">

    <style>
        /* ====================================================================
           DESIGN TOKENS
           ==================================================================== */
        :root {
            --font: ui-rounded, "SF Pro Rounded", "Nunito", "Baloo 2", system-ui,
                    -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

            /* Daypart palette (hex codes per briefing §4.1) */
            --morning-1:#FEF3C7; --morning-2:#FCD34D; --morning-3:#F59E0B; --morning-ink:#92400E;
            --afternoon-1:#FFEDD5; --afternoon-2:#FDBA74; --afternoon-3:#F97316; --afternoon-ink:#9A3412;
            --evening-1:#312E81; --evening-2:#60A5FA; --evening-3:#3B82F6; --evening-ink:#1E3A8A;

            /* Task states */
            --task-1:#C084FC; --task-2:#F472B6; --task-3:#FB7185;
            --done-1:#4ADE80; --done-2:#16A34A;
            --idle:#D1D5DB;

            /* Neutrals */
            --ink:#1F2937; --ink-soft:#6B7280; --ink-faint:#9CA3AF;
            --line:#ECE7F5; --surface:#FFFFFF; --canvas:#F5F1FB;

            /* Shape */
            --r-sm:12px; --r-md:18px; --r-lg:26px; --r-xl:34px; --r-pill:999px;
            --shadow-sm:0 2px 6px rgba(76,29,149,.07);
            --shadow-md:0 10px 24px -8px rgba(76,29,149,.20), 0 2px 6px rgba(76,29,149,.06);
            --shadow-lg:0 24px 48px -16px rgba(76,29,149,.38), 0 6px 16px rgba(76,29,149,.10);

            /* Child-mode task orb: never smaller than the 120px minimum (§2.1.3) */
            --orb: clamp(120px, 33vw, 152px);

            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-t: env(safe-area-inset-top, 0px);
        }

        /* ====================================================================
           RESET & BASE
           ==================================================================== */
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0;
            min-height: 100%;
            background: var(--canvas);
        }

        body {
            font-family: var(--font);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        button, input, select, textarea { font: inherit; color: inherit; }
        button { border: 0; background: none; cursor: pointer; }
        h1, h2, h3, p { margin: 0; }
        ul { margin: 0; padding: 0; list-style: none; }

        /* Desktop: show the app as a phone-shaped canvas on a soft backdrop */
        @media (min-width: 620px) {
            body {
                background:
                    radial-gradient(1000px 600px at 15% -5%, #EDE9FE 0%, transparent 60%),
                    radial-gradient(900px 500px at 100% 0%, #FCE7F3 0%, transparent 55%),
                    var(--canvas);
            }
        }

        .app {
            position: relative;
            max-width: 480px;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 auto;
            background: var(--surface);
            overflow: hidden;
        }
        @media (min-width: 620px) {
            .app {
                min-height: calc(100dvh - 48px);
                margin: 24px auto;
                border-radius: var(--r-xl);
                box-shadow: var(--shadow-lg);
            }
        }

        /* ====================================================================
           SKY HEADER (child mode)
           ==================================================================== */
        .sky {
            position: relative;
            padding: calc(14px + var(--safe-t)) 18px 22px;
            overflow: hidden;
            transition: background 600ms ease;
        }
        .sky--morning   { background: linear-gradient(170deg, #FFFBEB 0%, var(--morning-1) 42%, var(--morning-2) 100%); }
        .sky--afternoon { background: linear-gradient(170deg, #FFF7ED 0%, var(--afternoon-1) 42%, var(--afternoon-2) 100%); }
        .sky--evening   { background: linear-gradient(170deg, #1E1B4B 0%, var(--evening-1) 45%, #4F46E5 100%); }

        .sky__deco { position: absolute; inset: 0; pointer-events: none; }
        .sky__sun {
            position: absolute; right: -26px; top: -30px;
            width: 132px; height: 132px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #FFFFFF 0%, #FDE68A 42%, #FBBF24 100%);
            box-shadow: 0 0 46px rgba(251,191,36,.6);
            animation: drift 9s ease-in-out infinite;
        }
        .sky--afternoon .sky__sun {
            background: radial-gradient(circle at 35% 35%, #FFFFFF 0%, #FED7AA 42%, #FB923C 100%);
            box-shadow: 0 0 46px rgba(251,146,60,.6);
        }
        .sky__moon {
            /* Kept clear of the settings gear in the top-right corner. */
            position: absolute; right: 78px; top: calc(4px + var(--safe-t));
            width: 62px; height: 62px; border-radius: 50%;
            background: radial-gradient(circle at 62% 38%, #FFFFFF 0%, #E0E7FF 55%, #C7D2FE 100%);
            box-shadow: 0 0 34px rgba(199,210,254,.75);
            animation: drift 11s ease-in-out infinite;
        }
        .sky__cloud {
            position: absolute;
            background: rgba(255,255,255,.85);
            border-radius: var(--r-pill);
            filter: blur(.3px);
            animation: cloud-drift 26s linear infinite;
        }
        .sky__star {
            position: absolute;
            width: 4px; height: 4px; border-radius: 50%;
            background: #FFFFFF;
            animation: twinkle 2.6s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translateY(0) }
            50%      { transform: translateY(9px) }
        }
        @keyframes cloud-drift {
            0%   { transform: translateX(-30px) }
            100% { transform: translateX(440px) }
        }
        @keyframes twinkle {
            0%, 100% { opacity: .25; transform: scale(.7) }
            50%      { opacity: 1;   transform: scale(1.25) }
        }

        .sky__bar {
            position: relative;
            display: flex; align-items: center; gap: 12px;
        }
        .sky__avatar {
            width: 56px; height: 56px; flex: none;
            display: grid; place-items: center;
            font-size: 32px; line-height: 1;
            background: rgba(255,255,255,.72);
            border-radius: 50%;
            box-shadow: var(--shadow-sm), inset 0 0 0 2px rgba(255,255,255,.9);
            backdrop-filter: blur(6px);
        }
        .sky__who { min-width: 0; }
        .sky__hello {
            font-size: 13px; font-weight: 600; letter-spacing: .02em;
            color: var(--morning-ink); opacity: .75;
        }
        .sky__name {
            font-size: 24px; font-weight: 800; line-height: 1.15;
            color: var(--morning-ink);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .sky--afternoon .sky__hello, .sky--afternoon .sky__name { color: var(--afternoon-ink); }
        .sky--evening   .sky__hello { color: #C7D2FE; opacity: .95; }
        .sky--evening   .sky__name  { color: #FFFFFF; }

        .sky__gear {
            margin-left: auto; flex: none;
            width: 46px; height: 46px;
            display: grid; place-items: center;
            font-size: 22px;
            background: rgba(255,255,255,.72);
            border-radius: 50%;
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(6px);
            transition: transform .25s ease;
        }
        .sky__gear:hover { transform: rotate(45deg) scale(1.06); }
        .sky__gear:active { transform: scale(.92); }
        .sky--evening .sky__gear { background: rgba(255,255,255,.2); }

        /* ====================================================================
           DAYPART TABS
           ==================================================================== */
        .tabs {
            position: sticky; top: 0; z-index: 20;
            display: flex; gap: 8px;
            padding: 10px 12px;
            background: rgba(255,255,255,.88);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }
        .tab {
            flex: 1;
            min-height: 58px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 2px;
            border-radius: var(--r-md);
            font-size: 12px; font-weight: 800; letter-spacing: .06em;
            transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease, background .22s ease;
        }
        .tab__emoji { font-size: 22px; line-height: 1; }
        .tab--morning   { background: var(--morning-2);   color: var(--morning-ink); }
        .tab--afternoon { background: var(--afternoon-2); color: var(--afternoon-ink); }
        .tab--evening   { background: var(--evening-2);   color: #FFFFFF; }
        .tab:not(.is-active) { opacity: .62; }
        .tab:not(.is-active):hover { opacity: .85; }
        .tab.is-active { transform: scale(1.05); opacity: 1; box-shadow: var(--shadow-md); }
        .tab--morning.is-active   { background: linear-gradient(160deg, var(--morning-2), var(--morning-3)); }
        .tab--afternoon.is-active { background: linear-gradient(160deg, var(--afternoon-2), var(--afternoon-3)); }
        .tab--evening.is-active   { background: linear-gradient(160deg, var(--evening-2), var(--evening-3)); }
        .tab__badge {
            position: absolute; top: 6px; right: 8px;
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--done-2); color: #fff;
            font-size: 11px; display: grid; place-items: center;
        }
        .tab { position: relative; }

        /* ====================================================================
           DAYPART PROGRESS BAR
           ==================================================================== */
        .dp-progress { padding: 16px 20px 4px; }
        .dp-progress__top {
            display: flex; align-items: baseline; gap: 8px;
            margin-bottom: 8px;
        }
        .dp-progress__label { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
        .dp-progress__count { margin-left: auto; font-size: 14px; font-weight: 800; color: var(--ink); }
        .dp-progress__track {
            height: 12px; border-radius: var(--r-pill);
            background: #EEE9F7; overflow: hidden;
        }
        .dp-progress__fill {
            height: 100%; border-radius: var(--r-pill);
            background: linear-gradient(90deg, var(--done-1), var(--done-2));
            transition: width .6s cubic-bezier(.2,.9,.3,1);
        }

        /* ====================================================================
           TASK GRID & ORBS
           ==================================================================== */
        .content { padding: 12px 20px 150px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px 16px;
            justify-items: center;
        }

        .task { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

        .orb {
            position: relative;
            width: var(--orb); height: var(--orb);
            border-radius: 50%;
            display: grid; place-items: center;
            font-size: calc(var(--orb) * .42);
            line-height: 1;
            background:
                radial-gradient(circle at 32% 26%, rgba(255,255,255,.55) 0%, transparent 46%),
                linear-gradient(145deg, var(--task-1) 0%, var(--task-2) 52%, var(--task-3) 100%);
            box-shadow: var(--shadow-md), inset 0 -10px 20px rgba(88,28,135,.18);
            transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
            animation: breathe 2.8s ease-in-out infinite;
        }
        .orb::after {
            content: ""; position: absolute; inset: 0; border-radius: 50%;
            box-shadow: inset 0 0 0 4px rgba(255,255,255,.35);
        }
        .orb:hover { transform: scale(1.05); }
        .orb:active { transform: scale(.94); }

        .orb--done {
            background:
                radial-gradient(circle at 32% 26%, rgba(255,255,255,.45) 0%, transparent 46%),
                linear-gradient(145deg, var(--done-1), var(--done-2));
            animation: none;
        }
        .orb__check {
            position: absolute; inset: 0;
            display: grid; place-items: center;
            border-radius: 50%;
            background: rgba(22,163,74,.82);
            color: #FFFFFF;
            font-size: calc(var(--orb) * .40);
            font-weight: 800;
        }
        .orb__check svg { width: 46%; height: 46%; }
        .orb__check path {
            fill: none; stroke: #FFFFFF; stroke-width: 12;
            stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 100; stroke-dashoffset: 0;
        }
        .orb--pop { animation: pop .62s cubic-bezier(.34,1.56,.64,1); }
        .orb--pop .orb__check path { animation: draw .5s .1s ease-out backwards; }

        @keyframes breathe {
            0%, 100% { transform: scale(1) }
            50%      { transform: scale(1.045) }
        }
        @keyframes pop {
            0%   { transform: scale(.7) }
            45%  { transform: scale(1.16) }
            100% { transform: scale(1) }
        }
        @keyframes draw {
            from { stroke-dashoffset: 100 }
            to   { stroke-dashoffset: 0 }
        }

        .task__name {
            font-size: 18px; font-weight: 700; text-align: center;
            line-height: 1.25; color: var(--ink);
        }
        .task--done .task__name { color: var(--done-2); }

        /* ====================================================================
           EMPTY STATES
           ==================================================================== */
        .empty { text-align: center; padding: 54px 16px; }
        .empty__art { font-size: 72px; line-height: 1; margin-bottom: 16px; animation: drift 4s ease-in-out infinite; }
        .empty__title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
        .empty__text { font-size: 16px; color: var(--ink-soft); line-height: 1.45; }

        /* ====================================================================
           MINI TRAIN (sticky footer)
           ==================================================================== */
        .minitrain {
            position: fixed; z-index: 20;
            left: 50%; transform: translateX(-50%);
            bottom: calc(16px + var(--safe-b));
            display: flex; align-items: center; gap: 9px;
            padding: 11px 18px 11px 14px;
            background: rgba(255,255,255,.94);
            backdrop-filter: blur(14px);
            border-radius: var(--r-pill);
            box-shadow: var(--shadow-lg);
            transition: transform .22s cubic-bezier(.34,1.56,.64,1);
        }
        .minitrain:hover { transform: translateX(-50%) scale(1.04); }
        .minitrain:active { transform: translateX(-50%) scale(.97); }
        .minitrain__loco { font-size: 24px; line-height: 1; }
        .minitrain__cars { display: flex; gap: 5px; }
        .minitrain__car {
            width: 24px; height: 24px; border-radius: 7px;
            background: var(--idle);
        }
        .minitrain__car--done { background: linear-gradient(150deg, var(--done-1), var(--done-2)); }
        .minitrain__car--today {
            background: #FFFFFF;
            box-shadow: inset 0 0 0 2px var(--task-2);
            animation: breathe 2s ease-in-out infinite;
        }
        .minitrain__count {
            font-size: 15px; font-weight: 800; color: var(--ink);
            padding-left: 3px;
        }

        /* ====================================================================
           FULL TRAIN
           ==================================================================== */
        .train { padding: 6px 0 2px; }
        .train__row {
            position: relative;
            display: flex; align-items: flex-end; gap: 6px;
            padding-bottom: 16px;
            margin-bottom: 12px;
            min-height: 96px;
        }
        .train__row::after {
            content: ""; position: absolute; left: 0; right: 0; bottom: 6px;
            height: 6px; border-radius: 3px;
            background:
                repeating-linear-gradient(90deg, #C4B5FD 0 6px, transparent 6px 14px) 0 0/100% 3px no-repeat,
                linear-gradient(#A78BFA, #8B5CF6) 0 3px/100% 3px no-repeat;
        }
        .loco {
            flex: none;
            width: 56px; height: 62px;
            display: grid; place-items: center;
            font-size: 34px; line-height: 1;
            animation: chug 1.6s ease-in-out infinite;
        }
        @keyframes chug {
            0%, 100% { transform: translateY(0) }
            50%      { transform: translateY(-3px) }
        }

        .wagon {
            position: relative; flex: none;
            width: 56px; height: 76px;
            border-radius: 14px 14px 8px 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 3px;
            background: var(--idle);
            box-shadow: var(--shadow-sm);
            transition: transform .22s cubic-bezier(.34,1.56,.64,1);
        }
        .wagon::before, .wagon::after {
            content: ""; position: absolute; bottom: -5px;
            width: 13px; height: 13px; border-radius: 50%;
            background: #4C1D95;
            box-shadow: inset 0 0 0 3px rgba(255,255,255,.6);
        }
        .wagon::before { left: 7px; }
        .wagon::after  { right: 7px; }
        .wagon--done {
            background: linear-gradient(160deg, #FDE047 0%, #FBBF24 50%, #F97316 100%);
            box-shadow: var(--shadow-md);
        }
        .wagon--done:hover { transform: translateY(-4px) scale(1.06); }
        .wagon--today {
            background: #FFFFFF;
            box-shadow: inset 0 0 0 3px var(--task-2), var(--shadow-sm);
        }
        .wagon__num { font-size: 13px; font-weight: 800; color: rgba(0,0,0,.55); }
        .wagon--done .wagon__num { color: #78350F; }
        .wagon__art { font-size: 22px; line-height: 1; }
        .wagon__star {
            position: absolute; top: -12px; right: -6px;
            font-size: 17px;
            animation: twinkle 2.2s ease-in-out infinite;
        }
        .wagon--new { animation: wagon-arrive .8s cubic-bezier(.34,1.56,.64,1); }
        @keyframes wagon-arrive {
            0%   { transform: translateX(46px) scale(.6); opacity: 0 }
            60%  { transform: translateX(-5px) scale(1.12); opacity: 1 }
            100% { transform: translateX(0) scale(1); opacity: 1 }
        }

        /* ====================================================================
           PARENT MODE
           ==================================================================== */
        .p-head {
            display: flex; align-items: center; gap: 10px;
            padding: calc(14px + var(--safe-t)) 16px 14px;
            background: linear-gradient(150deg, #312E81, #4C1D95 60%, #6D28D9);
            color: #FFFFFF;
        }
        .p-head__back {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 15px 9px 11px;
            border-radius: var(--r-pill);
            background: rgba(255,255,255,.16);
            font-size: 14px; font-weight: 700; color: #FFFFFF;
            transition: background .2s ease;
        }
        .p-head__back:hover { background: rgba(255,255,255,.26); }
        .p-head__title { margin-left: auto; margin-right: auto; font-size: 17px; font-weight: 800; }
        .p-head__spacer { width: 84px; flex: none; }

        .segmented {
            display: flex; gap: 4px;
            margin: 14px 16px 0;
            padding: 4px;
            background: #EEE9F7;
            border-radius: var(--r-pill);
        }
        .segmented__item {
            flex: 1; padding: 11px 8px;
            border-radius: var(--r-pill);
            font-size: 14px; font-weight: 700; color: var(--ink-soft);
            transition: all .2s ease;
        }
        .segmented__item.is-active {
            background: var(--surface); color: #5B21B6;
            box-shadow: var(--shadow-sm);
        }

        .p-body { padding: 16px 16px calc(28px + var(--safe-b)); }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
        }
        .card__title {
            display: flex; align-items: center; gap: 8px;
            font-size: 17px; font-weight: 800; margin-bottom: 4px;
        }
        .card__hint { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 14px; }

        .field { margin-bottom: 14px; }
        .field:last-child { margin-bottom: 0; }
        .field__label {
            display: block;
            font-size: 12px; font-weight: 700; letter-spacing: .04em;
            text-transform: uppercase; color: var(--ink-soft);
            margin-bottom: 7px;
        }
        .input, .select {
            width: 100%;
            padding: 13px 14px;
            border: 2px solid var(--line);
            border-radius: var(--r-md);
            background: var(--surface);
            font-size: 15px; font-weight: 600;
            transition: border-color .2s ease, box-shadow .2s ease;
            -webkit-appearance: none; appearance: none;
        }
        .select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B7280' stroke-width='3' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 18px;
            padding-right: 40px;
        }
        .input:focus, .select:focus {
            outline: none;
            border-color: var(--task-1);
            box-shadow: 0 0 0 4px rgba(192,132,252,.22);
        }
        .input--word { text-transform: uppercase; letter-spacing: .08em; font-weight: 800; }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 8px;
        }
        .avatar-opt {
            aspect-ratio: 1;
            display: grid; place-items: center;
            font-size: 26px;
            border-radius: var(--r-md);
            background: #F7F4FC;
            border: 2px solid transparent;
            transition: all .18s ease;
        }
        .avatar-opt:hover { background: #EFE9FB; transform: scale(1.06); }
        .avatar-opt.is-active {
            border-color: var(--task-1);
            background: #F5EBFF;
            box-shadow: 0 0 0 4px rgba(192,132,252,.18);
        }

        .chiprow { display: flex; gap: 6px; margin-bottom: 14px; }
        .chip {
            flex: 1; padding: 11px 6px;
            border-radius: var(--r-md);
            font-size: 13px; font-weight: 700;
            background: #F4F0FA; color: var(--ink-soft);
            border: 2px solid transparent;
            transition: all .18s ease;
        }
        .chip.is-active { background: #FFFFFF; color: var(--ink); box-shadow: var(--shadow-sm); }
        .chip--morning.is-active   { border-color: var(--morning-2);   background: #FFFBEB; color: var(--morning-ink); }
        .chip--afternoon.is-active { border-color: var(--afternoon-2); background: #FFF7ED; color: var(--afternoon-ink); }
        .chip--evening.is-active   { border-color: var(--evening-2);   background: #EFF6FF; color: var(--evening-ink); }

        .tpl-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .tpl {
            position: relative;
            display: flex; align-items: center; gap: 10px;
            padding: 13px 12px;
            border-radius: var(--r-md);
            background: linear-gradient(135deg, #F3E8FF, #FCE7F3);
            text-align: left;
            transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
        }
        .tpl:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .tpl:active { transform: scale(.97); }
        .tpl__emoji { font-size: 27px; line-height: 1; flex: none; }
        .tpl__name { font-size: 13px; font-weight: 700; line-height: 1.25; }
        .tpl__rec {
            position: absolute; top: 6px; right: 7px;
            font-size: 12px; line-height: 1;
        }

        .tasklist { display: flex; flex-direction: column; gap: 10px; }
        .trow {
            display: flex; align-items: center; gap: 12px;
            padding: 12px;
            background: #FAF8FD;
            border: 1px solid var(--line);
            border-radius: var(--r-md);
        }
        .trow__emoji {
            width: 46px; height: 46px; flex: none;
            display: grid; place-items: center;
            font-size: 25px;
            background: #FFFFFF;
            border-radius: 14px;
            box-shadow: var(--shadow-sm);
        }
        .trow__body { min-width: 0; flex: 1; }
        .trow__name { font-size: 15px; font-weight: 800; }
        .trow__meta {
            font-size: 12px; color: var(--ink-soft);
            margin-top: 2px;
            display: flex; flex-wrap: wrap; gap: 5px 8px;
        }
        .trow__word {
            font-weight: 800; color: #6D28D9; letter-spacing: .04em;
        }
        .trow__actions { display: flex; gap: 6px; flex: none; }

        .iconbtn {
            width: 40px; height: 40px;
            display: grid; place-items: center;
            border-radius: 13px;
            font-size: 16px;
            background: #FFFFFF;
            border: 1px solid var(--line);
            transition: all .18s ease;
        }
        .iconbtn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        .iconbtn--danger:hover { background: #FEF2F2; border-color: #FCA5A5; }

        /* ====================================================================
           BUTTONS
           ==================================================================== */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%;
            padding: 15px 20px;
            border-radius: var(--r-md);
            font-size: 16px; font-weight: 800;
            transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, filter .18s ease;
        }
        .btn:active { transform: scale(.97); }
        .btn--primary { background: linear-gradient(140deg, #8B5CF6, #7C3AED); color: #FFFFFF; box-shadow: var(--shadow-md); }
        .btn--success { background: linear-gradient(140deg, var(--done-1), var(--done-2)); color: #FFFFFF; box-shadow: var(--shadow-md); }
        .btn--ghost   { background: #F1EDF9; color: var(--ink); }
        .btn--warn    { background: linear-gradient(140deg, #FB923C, #EA580C); color: #FFFFFF; }
        .btn--danger  { background: linear-gradient(140deg, #F87171, #DC2626); color: #FFFFFF; box-shadow: var(--shadow-md); }
        .btn--outline { background: #FFFFFF; color: #DC2626; border: 2px solid #FCA5A5; }
        .btn:hover { filter: brightness(1.05); }
        .btn--lg { padding: 18px 22px; font-size: 18px; }
        .btn[disabled] { opacity: .5; pointer-events: none; }

        .btn-row { display: flex; gap: 10px; }

        /* ====================================================================
           WEEK OVERVIEW / STATS
           ==================================================================== */
        .week { display: flex; flex-direction: column; gap: 7px; }
        .wday {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 13px;
            background: #FAF8FD;
            border: 1px solid var(--line);
            border-radius: var(--r-md);
        }
        .wday--today { border-color: var(--task-1); background: #FBF5FF; }
        .wday--done { background: linear-gradient(120deg, #FEFCE8, #FEF3C7); border-color: #FDE68A; }
        .wday__name { font-size: 14px; font-weight: 800; width: 34px; flex: none; }
        .wday__dots { display: flex; gap: 6px; }
        .dot {
            width: 26px; height: 26px; border-radius: 50%;
            background: #E5E7EB;
            display: grid; place-items: center;
            font-size: 13px; line-height: 1;
            filter: grayscale(1); opacity: .45;
            transition: all .25s ease;
        }
        .dot.is-on {
            background: linear-gradient(150deg, var(--done-1), var(--done-2));
            filter: none; opacity: 1;
            box-shadow: 0 2px 6px rgba(22,163,74,.32);
        }
        .wday__mark { margin-left: auto; font-size: 20px; line-height: 1; }
        .wday__tag { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--ink-faint); }

        .stat {
            text-align: center;
            padding: 24px 18px;
            border-radius: var(--r-lg);
            background: linear-gradient(150deg, #FFFBEB, #FEF3C7 55%, #FDE68A);
            border: 1px solid #FDE68A;
        }
        .stat__art { font-size: 54px; line-height: 1; margin-bottom: 8px; }
        .stat__big { font-size: 34px; font-weight: 900; line-height: 1.1; color: #92400E; }
        .stat__sub { font-size: 15px; font-weight: 700; color: #B45309; margin-top: 4px; }

        /* ====================================================================
           MODALS
           ==================================================================== */
        .overlay {
            position: fixed; inset: 0; z-index: 60;
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            background: rgba(23,16,48,.55);
            backdrop-filter: blur(5px);
            animation: fade-in .22s ease;
            overflow-y: auto;
        }
        .overlay--closing { animation: fade-out .18s ease forwards; }
        @keyframes fade-in  { from { opacity: 0 } to { opacity: 1 } }
        @keyframes fade-out { from { opacity: 1 } to { opacity: 0 } }

        .modal {
            width: 100%; max-width: 420px;
            margin: auto;
            background: var(--surface);
            border-radius: var(--r-xl);
            padding: 26px 22px;
            box-shadow: var(--shadow-lg);
            animation: modal-in .32s cubic-bezier(.34,1.56,.64,1);
        }
        .modal--wide { max-width: 560px; }
        .overlay--closing .modal { animation: modal-out .18s ease forwards; }
        @keyframes modal-in {
            from { opacity: 0; transform: translateY(22px) scale(.92) }
            to   { opacity: 1; transform: translateY(0) scale(1) }
        }
        @keyframes modal-out {
            from { opacity: 1; transform: scale(1) }
            to   { opacity: 0; transform: scale(.95) }
        }

        .modal__emoji { font-size: 78px; line-height: 1; text-align: center; margin-bottom: 10px; }
        .modal__title { font-size: 26px; font-weight: 900; text-align: center; line-height: 1.2; }
        .modal__sub { font-size: 15px; color: var(--ink-soft); text-align: center; margin-top: 8px; line-height: 1.5; }
        .modal__h { font-size: 21px; font-weight: 900; margin-bottom: 4px; }
        .modal__actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal__actions .btn { flex: 1; white-space: nowrap; font-size: 15px; padding: 15px 10px; }

        .wordbox {
            margin: 18px 0 14px;
            padding: 16px;
            border-radius: var(--r-lg);
            background: linear-gradient(140deg, #EFF6FF, #DBEAFE);
            text-align: center;
        }
        .wordbox__label { font-size: 13px; font-weight: 700; color: #1D4ED8; letter-spacing: .06em; text-transform: uppercase; }
        .wordbox__word {
            font-size: clamp(30px, 10vw, 46px);
            font-weight: 900; letter-spacing: .05em;
            color: #1D4ED8;
            line-height: 1.15; margin-top: 4px;
            word-break: break-word;
        }

        .verify-input {
            width: 100%;
            padding: 16px;
            text-align: center;
            font-size: 26px; font-weight: 800; letter-spacing: .12em;
            text-transform: uppercase;
            border: 3px solid #BFDBFE;
            border-radius: var(--r-lg);
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .verify-input:focus {
            outline: none; border-color: #3B82F6;
            box-shadow: 0 0 0 5px rgba(59,130,246,.18);
        }
        .verify-input.is-wrong {
            border-color: #F87171;
            animation: shake .42s cubic-bezier(.36,.07,.19,.97);
        }
        @keyframes shake {
            10%, 90% { transform: translateX(-2px) }
            20%, 80% { transform: translateX(4px) }
            30%, 50%, 70% { transform: translateX(-7px) }
            40%, 60% { transform: translateX(7px) }
        }

        .donebadge {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin: 16px 0;
            padding: 13px;
            border-radius: var(--r-lg);
            background: #F0FDF4;
            color: var(--done-2);
            font-size: 16px; font-weight: 800;
        }

        /* ====================================================================
           AUDIO RECORDER
           ==================================================================== */
        .rec {
            margin-top: 12px;
            padding: 16px;
            border-radius: var(--r-lg);
            background: #FDF4FF;
            border: 1px solid #F5D0FE;
        }
        .rec__row { display: flex; align-items: center; gap: 12px; }
        .rec__btn {
            width: 62px; height: 62px; flex: none;
            border-radius: 50%;
            display: grid; place-items: center;
            font-size: 26px;
            background: linear-gradient(140deg, #F87171, #DC2626);
            color: #FFFFFF;
            box-shadow: var(--shadow-md);
            transition: transform .2s ease;
        }
        .rec__btn:active { transform: scale(.93); }
        .rec__btn.is-recording { animation: rec-pulse 1.1s ease-in-out infinite; }
        @keyframes rec-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,.55) }
            50%      { box-shadow: 0 0 0 16px rgba(220,38,38,0) }
        }
        .rec__info { flex: 1; min-width: 0; }
        .rec__status { font-size: 14px; font-weight: 800; }
        .rec__hint { font-size: 12px; color: var(--ink-soft); margin-top: 3px; line-height: 1.45; }
        .rec__tools { display: flex; gap: 8px; margin-top: 12px; }
        .rec__tools .btn { padding: 11px 14px; font-size: 14px; }
        .rec__meter {
            height: 6px; border-radius: 3px; background: #F5D0FE; overflow: hidden; margin-top: 9px;
        }
        .rec__meter span {
            display: block; height: 100%;
            background: linear-gradient(90deg, #E879F9, #C026D3);
            width: 0%;
            transition: width .1s linear;
        }

        /* ====================================================================
           TOASTS
           ==================================================================== */
        .toasts {
            position: fixed; z-index: 90;
            top: calc(12px + var(--safe-t)); left: 50%;
            transform: translateX(-50%);
            width: min(420px, calc(100vw - 24px));
            display: flex; flex-direction: column; gap: 8px;
            pointer-events: none;
        }
        .toast {
            display: flex; align-items: center; gap: 10px;
            padding: 13px 16px;
            border-radius: var(--r-md);
            background: rgba(31,41,55,.96);
            color: #FFFFFF;
            font-size: 15px; font-weight: 700;
            box-shadow: var(--shadow-lg);
            animation: toast-in .3s cubic-bezier(.34,1.56,.64,1);
        }
        .toast--out { animation: toast-out .25s ease forwards; }
        .toast--error   { background: linear-gradient(135deg, #EF4444, #B91C1C); }
        .toast--success { background: linear-gradient(135deg, #22C55E, #15803D); }
        .toast--party   { background: linear-gradient(135deg, #A855F7, #DB2777); }
        .toast__icon { font-size: 20px; line-height: 1; flex: none; }
        @keyframes toast-in  { from { opacity: 0; transform: translateY(-16px) scale(.94) } to { opacity: 1; transform: none } }
        @keyframes toast-out { to { opacity: 0; transform: translateY(-12px) scale(.96) } }

        /* ====================================================================
           PARTICLE ANIMATIONS
           ==================================================================== */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            will-change: transform, opacity;
        }

        @keyframes star-burst {
            0%   { transform: translate(0,0) rotate(0deg) scale(.4); opacity: 1 }
            60%  { opacity: 1 }
            100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.1); opacity: 0 }
        }
        @keyframes confetti-fall {
            0%   { transform: translateY(-40px) rotate(0deg); opacity: 1 }
            100% { transform: translateY(102vh) rotate(var(--rot)); opacity: .15 }
        }
        @keyframes balloon-rise {
            0%   { transform: translate(0,0) rotate(-6deg); opacity: 0 }
            12%  { opacity: 1 }
            100% { transform: translate(var(--tx), -106vh) rotate(6deg); opacity: 0 }
        }
        @keyframes firework-burst {
            0%   { transform: translate(0,0) scale(.2); opacity: 1 }
            70%  { opacity: 1 }
            100% { transform: translate(var(--tx), var(--ty)) scale(.35); opacity: 0 }
        }
        @keyframes heart-float {
            0%   { transform: translate(0,0) scale(.6); opacity: 0 }
            18%  { opacity: 1; transform: translate(0,-20px) scale(1.15) }
            100% { transform: translate(var(--tx), -62vh) scale(.8); opacity: 0 }
        }
        @keyframes smoke-puff {
            0%   { transform: translate(0,0) scale(.5); opacity: .8 }
            100% { transform: translate(var(--tx), -120px) scale(2); opacity: 0 }
        }

        /* ====================================================================
           CELEBRATION MODAL
           ==================================================================== */
        .celebrate {
            background: linear-gradient(155deg, #FDE047 0%, #FB923C 45%, #EC4899 100%);
            color: #FFFFFF;
            text-align: center;
        }
        .celebrate .modal__title { color: #FFFFFF; text-shadow: 0 2px 10px rgba(0,0,0,.18); }
        .celebrate__art { font-size: 84px; line-height: 1; margin-bottom: 8px; animation: pop .8s cubic-bezier(.34,1.56,.64,1); }
        .celebrate__line { font-size: 19px; font-weight: 800; margin-top: 8px; }
        .celebrate__train { font-size: 34px; letter-spacing: 3px; margin: 18px 0 4px; }

        .helper {
            font-size: 12px; color: var(--ink-faint);
            text-align: center; line-height: 1.5;
            margin-top: 10px;
        }

        .divider { height: 1px; background: var(--line); margin: 16px 0; }

        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <div id="app" class="app"><!-- rendered by HabitTrackerApp --></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <script>
        // ====================================================================
        // DATA MODEL & CONSTANTS
        // ====================================================================

        const TASK_TEMPLATES = [
            { name: 'Tanden poetsen',    emoji: '🪥',  word: 'TANDEN',   dayPart: 'morning' },
            { name: 'Aankleden',         emoji: '👕',  word: 'KLEREN',   dayPart: 'morning' },
            { name: 'Handen wassen',     emoji: '🧼',  word: 'HANDEN',   dayPart: 'afternoon' },
            { name: 'Jas ophangen',      emoji: '🧥',  word: 'JAS',      dayPart: 'afternoon' },
            { name: 'Schoenen uit',      emoji: '👟',  word: 'SCHOENEN', dayPart: 'afternoon' },
            { name: 'Bordje leeg',       emoji: '🍽️', word: 'BORDJE',   dayPart: 'afternoon' },
            { name: 'Hele weg gelopen',  emoji: '🚶',  word: 'LOPEN',    dayPart: 'afternoon' },
            { name: 'Opruimen speelgoed',emoji: '🧸',  word: 'OPRUIMEN', dayPart: 'evening' },
            { name: 'Naar bed gaan',     emoji: '😴',  word: 'SLAPEN',   dayPart: 'evening' },
            { name: 'In bed blijven',    emoji: '🛏️', word: 'BED',      dayPart: 'evening' }
        ];

        const DAY_PARTS = ['morning', 'afternoon', 'evening'];

        const DAY_PART_META = {
            morning:   { label: 'Ochtend', emoji: '🐓', greeting: 'Goedemorgen' },
            afternoon: { label: 'Middag',  emoji: '🌞', greeting: 'Goedemiddag' },
            evening:   { label: 'Avond',   emoji: '🌛', greeting: 'Goedenavond' }
        };

        const ANIMATIONS = [
            { id: 'stars',     label: '⭐ Sterren' },
            { id: 'confetti',  label: '🎊 Confetti' },
            { id: 'balloons',  label: '🎈 Ballonnen' },
            { id: 'fireworks', label: '🎆 Vuurwerk' },
            { id: 'hearts',    label: '💕 Hartjes' }
        ];

        const SOUNDS = [
            { id: 'pling',  label: 'Pling!' },
            { id: 'hoera',  label: 'Hoera!' },
            { id: 'gelukt', label: 'Gelukt!' },
            { id: 'custom', label: '🎤 Eigen opname' }
        ];

        const AVATARS = ['👶','🧒','👦','👧','🐣','🐻','🦊','🐰','🦄','🐼','🐨','🦁','🐸','🐙','🌟','🚀'];

        const DAY_NAMES_SHORT = ['Ma','Di','Wo','Do','Vr','Za','Zo'];
        const DAY_NAMES_LONG  = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];

        const STORAGE = {
            tasks:    'habitTracker_tasks',
            history:  'habitTracker_history',
            profile:  'habitTracker_profile',
            settings: 'habitTracker_settings',
            legacy:   'habitTracker_weekProgress'
        };

        const MAX_RECORDING_MS = 5000;

        // ====================================================================
        // SMALL UTILITIES
        // ====================================================================

        /** localStorage can throw (private mode, quota). Never let that break the app. */
        function readJSON(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                if (raw === null) return fallback;
                const parsed = JSON.parse(raw);
                return parsed === null || parsed === undefined ? fallback : parsed;
            } catch (err) {
                console.warn('Kon opslag niet lezen:', key, err);
                return fallback;
            }
        }

        function writeJSON(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
                return true;
            } catch (err) {
                console.warn('Kon opslag niet schrijven:', key, err);
                return false;
            }
        }

        /** Local (not UTC) YYYY-MM-DD — the app reasons about the family's own day. */
        function dateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function addDays(date, amount) {
            const copy = new Date(date);
            copy.setDate(copy.getDate() + amount);
            return copy;
        }

        /** Monday of the week containing `date` — week starts on Monday (FAQ §10). */
        function startOfWeek(date) {
            const copy = new Date(date);
            copy.setHours(0, 0, 0, 0);
            const weekday = copy.getDay() === 0 ? 7 : copy.getDay();
            return addDays(copy, 1 - weekday);
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ====================================================================
        // AUDIO STORE (IndexedDB) — custom parent recordings, one per task
        // ====================================================================

        const AudioStore = {
            DB_NAME: 'habitTrackerAudio',
            STORE: 'clips',
            _db: null,

            supported() {
                return typeof indexedDB !== 'undefined';
            },

            open() {
                if (this._db) return Promise.resolve(this._db);
                if (!this.supported()) return Promise.reject(new Error('IndexedDB niet beschikbaar'));

                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.DB_NAME, 1);
                    request.onupgradeneeded = () => {
                        const db = request.result;
                        if (!db.objectStoreNames.contains(this.STORE)) {
                            db.createObjectStore(this.STORE);
                        }
                    };
                    request.onsuccess = () => { this._db = request.result; resolve(this._db); };
                    request.onerror = () => reject(request.error);
                });
            },

            _tx(mode, work) {
                return this.open().then(db => new Promise((resolve, reject) => {
                    const tx = db.transaction(this.STORE, mode);
                    const store = tx.objectStore(this.STORE);
                    const request = work(store);
                    tx.oncomplete = () => resolve(request ? request.result : undefined);
                    tx.onerror = () => reject(tx.error);
                }));
            },

            put(id, blob) { return this._tx('readwrite', store => store.put(blob, id)); },
            get(id)       { return this._tx('readonly',  store => store.get(id)); },
            remove(id)    { return this._tx('readwrite', store => store.delete(id)); }
        };

        // ====================================================================
        // APP
        // ====================================================================

        class HabitTrackerApp {
            constructor() {
                this.mode = 'child';            // 'child' | 'parent'
                this.parentTab = 'manage';      // 'manage' | 'progress'
                this.templateDayPart = this.detectDayPart();
                this.activeDayPart = this.detectDayPart();

                this.tasks = this.loadTasks();
                this.history = this.loadHistory();
                this.profile = this.loadProfile();
                this.settings = this.loadSettings();

                this.audioContext = null;
                this.recorder = null;           // active MediaRecorder session state
                this.pendingRecording = null;   // Blob waiting to be saved from the edit modal
                this.justCompletedTaskId = null;
                this.previousTrainLength = 0;

                this.init();
            }

            init() {
                this.migrateLegacyWeekProgress();
                this.applyDayRollover({ silent: true });
                this.syncTodayProgress({ celebrate: false });
                this.previousTrainLength = this.getCompletedDates().length;
                this.render();
                this.bindGlobalEvents();
                this.scheduleMidnightCheck();
            }

            // ================================================================
            // DATA PERSISTENCE
            // ================================================================

            loadTasks() {
                const saved = readJSON(STORAGE.tasks, null);
                const empty = { morning: [], afternoon: [], evening: [] };
                if (!saved || typeof saved !== 'object') return empty;

                DAY_PARTS.forEach(part => {
                    if (!Array.isArray(saved[part])) saved[part] = [];
                });
                return saved;
            }

            saveTasks() { writeJSON(STORAGE.tasks, this.tasks); }

            /** history: { 'YYYY-MM-DD': { morning, afternoon, evening, completed } } */
            loadHistory() {
                const saved = readJSON(STORAGE.history, null);
                return saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
            }

            saveHistory() { writeJSON(STORAGE.history, this.history); }

            loadProfile() {
                const saved = readJSON(STORAGE.profile, null);
                return {
                    name: (saved && saved.name) || 'Kind',
                    avatar: (saved && saved.avatar) || '👶'
                };
            }

            saveProfile() { writeJSON(STORAGE.profile, this.profile); }

            loadSettings() {
                const saved = readJSON(STORAGE.settings, null) || {};
                return {
                    autoReset: saved.autoReset !== false,           // default on (keuze 8b)
                    lastActiveDate: saved.lastActiveDate || dateKey(new Date())
                };
            }

            saveSettings() { writeJSON(STORAGE.settings, this.settings); }

            /**
             * v1 stored a fixed 7-slot array indexed by weekday. Map those slots onto the
             * real dates of the week they were recorded in, then retire the old key.
             */
            migrateLegacyWeekProgress() {
                const legacy = readJSON(STORAGE.legacy, null);
                if (!Array.isArray(legacy)) return;

                if (Object.keys(this.history).length === 0) {
                    const monday = startOfWeek(new Date());
                    legacy.forEach((day, index) => {
                        const parts = (day && day.dayParts) || {};
                        const hasAny = parts.morning || parts.afternoon || parts.evening || (day && day.completed);
                        if (!hasAny) return;

                        this.history[dateKey(addDays(monday, index))] = {
                            morning: !!parts.morning,
                            afternoon: !!parts.afternoon,
                            evening: !!parts.evening,
                            completed: !!(day && day.completed)
                        };
                    });
                    this.saveHistory();
                }

                try { localStorage.removeItem(STORAGE.legacy); } catch (err) { /* ignore */ }
            }

            // ================================================================
            // TIME DETECTION & DAY ROLLOVER
            // ================================================================

            detectDayPart() {
                const hour = new Date().getHours();
                if (hour >= 6 && hour < 12) return 'morning';
                if (hour >= 12 && hour < 18) return 'afternoon';
                return 'evening';
            }

            todayKey() { return dateKey(new Date()); }

            /** Blank slate for a day that has no record yet. */
            emptyDayEntry() {
                return { morning: false, afternoon: false, evening: false, completed: false };
            }

            getDayEntry(key) {
                return this.history[key] || this.emptyDayEntry();
            }

            /**
             * Auto-reset at midnight (keuze 8b). Yesterday's result already lives in
             * history, so rolling over only means clearing the checkmarks.
             */
            applyDayRollover({ silent = false } = {}) {
                const today = this.todayKey();
                if (this.settings.lastActiveDate === today) return false;

                this.settings.lastActiveDate = today;
                this.saveSettings();

                if (!this.settings.autoReset) return false;

                let cleared = 0;
                DAY_PARTS.forEach(part => {
                    this.tasks[part].forEach(task => {
                        if (task.completed) { task.completed = false; cleared++; }
                    });
                });

                if (cleared > 0) {
                    this.saveTasks();
                    if (!silent) {
                        this.render();
                        this.toast('Nieuwe dag! Alle taken staan weer klaar ☀️', 'success');
                    }
                }
                return cleared > 0;
            }

            /** Re-check the clock periodically so an app left open overnight still rolls over. */
            scheduleMidnightCheck() {
                const tick = () => {
                    const rolled = this.applyDayRollover();
                    const partNow = this.detectDayPart();
                    if (!rolled && this.mode === 'child' && partNow !== this.activeDayPart && !document.querySelector('.overlay')) {
                        // Only auto-follow the clock when the child hasn't manually picked a tab.
                        if (!this.dayPartPinned) {
                            this.activeDayPart = partNow;
                            this.render();
                        }
                    }
                };
                setInterval(tick, 60 * 1000);
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) tick();
                });
            }

            // ================================================================
            // TASK MANAGEMENT
            // ================================================================

            addTask(templateIndex, dayPart) {
                const template = TASK_TEMPLATES[templateIndex];
                if (!template || !DAY_PARTS.includes(dayPart)) return;

                this.tasks[dayPart].push({
                    id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                    name: template.name,
                    emoji: template.emoji,
                    verifyWord: template.word,
                    completed: false,
                    animation: 'stars',
                    sound: 'pling'
                });

                this.saveTasks();
                this.syncTodayProgress({ celebrate: false });
                this.render();
                this.toast(`${template.emoji} ${template.name} toegevoegd aan ${DAY_PART_META[dayPart].label.toLowerCase()}`, 'success');
            }

            findTask(dayPart, taskId) {
                return (this.tasks[dayPart] || []).find(task => task.id === taskId) || null;
            }

            removeTask(dayPart, taskId) {
                const task = this.findTask(dayPart, taskId);
                if (!task) return;

                // §2.2.5: deletion is immediate, no confirmation dialog.
                if (task.customAudioId && AudioStore.supported()) {
                    AudioStore.remove(task.customAudioId).catch(() => { /* best effort */ });
                }

                this.tasks[dayPart] = this.tasks[dayPart].filter(item => item.id !== taskId);
                this.saveTasks();
                this.syncTodayProgress({ celebrate: false });
                this.render();
                this.toast(`${task.emoji} ${task.name} verwijderd`, 'info');
            }

            updateTask(dayPart, taskId, updates) {
                const task = this.findTask(dayPart, taskId);
                if (!task) return;
                Object.assign(task, updates);
                this.saveTasks();
                this.render();
            }

            setTaskCompleted(dayPart, taskId, completed) {
                const task = this.findTask(dayPart, taskId);
                if (!task || task.completed === completed) return;

                task.completed = completed;
                this.saveTasks();

                if (completed) {
                    this.justCompletedTaskId = taskId;
                    this.playAnimation(task.animation);
                    this.playSound(task.sound, task);
                }

                // Progress first, then paint — otherwise the train renders a stale count.
                this.syncTodayProgress({ celebrate: completed });
                this.render();
            }

            resetToday() {
                let cleared = 0;
                DAY_PARTS.forEach(part => {
                    this.tasks[part].forEach(task => {
                        if (task.completed) { task.completed = false; cleared++; }
                    });
                });
                this.saveTasks();

                // Today's wagon is undone as well — the day is genuinely back to zero.
                delete this.history[this.todayKey()];
                this.saveHistory();

                this.syncTodayProgress({ celebrate: false });
                this.render();
                this.toast(cleared > 0 ? 'Vandaag is gereset 🔄' : 'Er stond nog niets aangevinkt', 'info');
            }

            resetTrain() {
                this.history = {};
                this.saveHistory();
                this.previousTrainLength = 0;
                this.syncTodayProgress({ celebrate: false });
                this.render();
                this.toast('De trein begint weer bij nul 🚂', 'info');
            }

            // ================================================================
            // PROGRESS TRACKING
            // ================================================================

            /** Keuze 3a: a daypart with no tasks can never block the day. */
            isDayPartComplete(dayPart) {
                const list = this.tasks[dayPart] || [];
                if (list.length === 0) return true;
                return list.every(task => task.completed);
            }

            totalTaskCount() {
                return DAY_PARTS.reduce((sum, part) => sum + this.tasks[part].length, 0);
            }

            /**
             * Recompute today's entry from the live task state, then cascade:
             * daypart done → day done → train milestone.
             */
            syncTodayProgress({ celebrate = true } = {}) {
                const key = this.todayKey();
                const before = this.getDayEntry(key);
                const entry = this.emptyDayEntry();

                DAY_PARTS.forEach(part => {
                    entry[part] = this.tasks[part].length > 0 && this.isDayPartComplete(part);
                });

                const everyPartDone = DAY_PARTS.every(part => this.isDayPartComplete(part));
                entry.completed = this.totalTaskCount() > 0 && everyPartDone;

                const changed = DAY_PARTS.some(part => entry[part] !== before[part]) || entry.completed !== before.completed;

                if (entry.completed || DAY_PARTS.some(part => entry[part])) {
                    this.history[key] = entry;
                } else {
                    delete this.history[key];
                }

                if (changed) this.saveHistory();
                if (!celebrate) {
                    this.previousTrainLength = this.getCompletedDates().length;
                    return;
                }

                const newlyFinishedPart = DAY_PARTS.find(part => entry[part] && !before[part]);
                const dayJustFinished = entry.completed && !before.completed;

                if (dayJustFinished) {
                    this.celebrateDayComplete();
                } else if (newlyFinishedPart) {
                    const meta = DAY_PART_META[newlyFinishedPart];
                    this.toast(`${meta.emoji} ${meta.label} helemaal klaar!`, 'party');
                    this.playAnimation('confetti');
                }

                this.previousTrainLength = this.getCompletedDates().length;
            }

            celebrateDayComplete() {
                const total = this.getCompletedDates().length;

                this.playSound('train');
                this.playAnimation('confetti');
                this.toast('🚂 Een nieuwe wagon aan je trein!', 'party');

                // Keuze 2b: the train keeps growing; every full row of 7 is a milestone.
                if (total > 0 && total % 7 === 0) {
                    setTimeout(() => this.showMilestoneModal(total), 700);
                }
            }

            /** All completed days, oldest first — one wagon each (keuze 2b). */
            getCompletedDates() {
                return Object.keys(this.history)
                    .filter(key => this.history[key] && this.history[key].completed)
                    .sort();
            }

            getCurrentWeekDays() {
                const monday = startOfWeek(new Date());
                const today = this.todayKey();

                return Array.from({ length: 7 }, (_, index) => {
                    const date = addDays(monday, index);
                    const key = dateKey(date);
                    return {
                        key,
                        index,
                        label: DAY_NAMES_SHORT[index],
                        longLabel: DAY_NAMES_LONG[index],
                        isToday: key === today,
                        isFuture: key > today,
                        entry: this.getDayEntry(key)
                    };
                });
            }

            getWeekCompletedCount() {
                return this.getCurrentWeekDays().filter(day => day.entry.completed).length;
            }

            // ================================================================
            // ANIMATIONS
            // ================================================================

            spawn(element, lifetimeMs) {
                element.className = `particle ${element.className}`.trim();
                document.body.appendChild(element);
                setTimeout(() => element.remove(), lifetimeMs);
            }

            playAnimation(type) {
                const width = window.innerWidth;
                const height = window.innerHeight;

                switch (type) {
                    case 'confetti':  return this.createConfetti(width);
                    case 'balloons':  return this.createBalloons(width, height);
                    case 'fireworks': return this.createFireworks(width, height);
                    case 'hearts':    return this.createHearts(width, height);
                    case 'stars':
                    default:          return this.createStars(width, height);
                }
            }

            createStars(width, height) {
                const centerX = width / 2;
                const centerY = height / 2;
                const glyphs = ['⭐', '✨', '🌟'];

                for (let i = 0; i < 16; i++) {
                    const star = document.createElement('div');
                    star.textContent = glyphs[i % glyphs.length];
                    star.style.cssText = `left:${centerX}px;top:${centerY}px;font-size:${26 + Math.random() * 18}px`;

                    const angle = (i / 16) * Math.PI * 2 + Math.random() * 0.3;
                    const distance = 130 + Math.random() * 110;
                    star.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                    star.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                    star.style.setProperty('--rot', `${Math.random() * 540 - 270}deg`);
                    star.style.animation = `star-burst ${0.9 + Math.random() * 0.4}s cubic-bezier(.2,.7,.3,1) forwards`;

                    this.spawn(star, 1600);
                }
            }

            createConfetti(width) {
                const colors = ['#F472B6', '#C084FC', '#60A5FA', '#4ADE80', '#FCD34D', '#FB923C'];

                for (let i = 0; i < 46; i++) {
                    const piece = document.createElement('div');
                    const size = 7 + Math.random() * 7;
                    piece.style.cssText =
                        `left:${Math.random() * width}px;top:-30px;` +
                        `width:${size}px;height:${size * (Math.random() > 0.5 ? 1 : 1.9)}px;` +
                        `background:${colors[i % colors.length]};` +
                        `border-radius:${Math.random() > 0.6 ? '50%' : '2px'};`;
                    piece.style.setProperty('--rot', `${Math.random() * 1080 - 540}deg`);
                    piece.style.animation = `confetti-fall ${1.9 + Math.random() * 1.3}s cubic-bezier(.25,.6,.4,1) ${Math.random() * 0.45}s forwards`;

                    this.spawn(piece, 3800);
                }
            }

            createBalloons(width, height) {
                const colors = ['🎈', '🎈', '🎈', '🎈', '🎈', '🎈'];

                colors.forEach((glyph, index) => {
                    const balloon = document.createElement('div');
                    balloon.textContent = glyph;
                    const left = (width / (colors.length + 1)) * (index + 1) - 20;
                    balloon.style.cssText = `left:${left}px;top:${height - 40}px;font-size:${40 + Math.random() * 18}px`;
                    balloon.style.setProperty('--tx', `${Math.random() * 70 - 35}px`);
                    balloon.style.animation = `balloon-rise ${2.6 + Math.random() * 1.2}s ease-in ${index * 0.14}s forwards`;

                    this.spawn(balloon, 4600);
                });
            }

            createFireworks(width, height) {
                const palettes = [
                    ['#FDE047', '#FACC15', '#FB923C'],
                    ['#F472B6', '#EC4899', '#C084FC'],
                    ['#60A5FA', '#38BDF8', '#4ADE80']
                ];

                for (let burst = 0; burst < 3; burst++) {
                    setTimeout(() => {
                        const originX = width * (0.25 + Math.random() * 0.5);
                        const originY = height * (0.2 + Math.random() * 0.25);
                        const palette = palettes[burst % palettes.length];

                        for (let i = 0; i < 22; i++) {
                            const spark = document.createElement('div');
                            const size = 5 + Math.random() * 5;
                            spark.style.cssText =
                                `left:${originX}px;top:${originY}px;width:${size}px;height:${size}px;` +
                                `border-radius:50%;background:${palette[i % palette.length]};` +
                                `box-shadow:0 0 12px ${palette[i % palette.length]};`;

                            const angle = (i / 22) * Math.PI * 2;
                            const distance = 90 + Math.random() * 90;
                            spark.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                            spark.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                            spark.style.animation = `firework-burst ${1 + Math.random() * 0.5}s cubic-bezier(.1,.7,.3,1) forwards`;

                            this.spawn(spark, 1900);
                        }
                    }, burst * 320);
                }
            }

            createHearts(width, height) {
                const glyphs = ['💕', '💖', '💗', '❤️', '💝'];

                for (let i = 0; i < 14; i++) {
                    const heart = document.createElement('div');
                    heart.textContent = glyphs[i % glyphs.length];
                    heart.style.cssText =
                        `left:${Math.random() * (width - 60) + 20}px;top:${height * 0.72}px;` +
                        `font-size:${24 + Math.random() * 22}px`;
                    heart.style.setProperty('--tx', `${Math.random() * 90 - 45}px`);
                    heart.style.animation = `heart-float ${2.1 + Math.random() * 1.1}s ease-out ${Math.random() * 0.5}s forwards`;

                    this.spawn(heart, 4000);
                }
            }

            /** Little puff of smoke above the mini train when a wagon is earned. */
            createSmoke(x, y) {
                for (let i = 0; i < 6; i++) {
                    const puff = document.createElement('div');
                    const size = 14 + Math.random() * 14;
                    puff.style.cssText =
                        `left:${x}px;top:${y}px;width:${size}px;height:${size}px;` +
                        `border-radius:50%;background:rgba(203,213,225,.85);`;
                    puff.style.setProperty('--tx', `${Math.random() * 60 - 30}px`);
                    puff.style.animation = `smoke-puff ${1.1 + Math.random() * 0.6}s ease-out ${i * 0.09}s forwards`;
                    this.spawn(puff, 2200);
                }
            }

            // ================================================================
            // SOUND EFFECTS (Web Audio synthesis — no asset files needed)
            // ================================================================

            getAudioContext() {
                if (!this.audioContext) {
                    const Ctor = window.AudioContext || window.webkitAudioContext;
                    if (!Ctor) return null;
                    this.audioContext = new Ctor();
                }
                if (this.audioContext.state === 'suspended') {
                    this.audioContext.resume().catch(() => { /* ignore */ });
                }
                return this.audioContext;
            }

            /** One shaped tone. `type` selects the oscillator waveform. */
            tone(ctx, { freq, start = 0, duration = 0.2, gain = 0.18, type = 'sine', sweepTo = null }) {
                const osc = ctx.createOscillator();
                const amp = ctx.createGain();
                const at = ctx.currentTime + start;

                osc.type = type;
                osc.frequency.setValueAtTime(freq, at);
                if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, at + duration);

                amp.gain.setValueAtTime(0.0001, at);
                amp.gain.exponentialRampToValueAtTime(gain, at + 0.015);
                amp.gain.exponentialRampToValueAtTime(0.0001, at + duration);

                osc.connect(amp);
                amp.connect(ctx.destination);
                osc.start(at);
                osc.stop(at + duration + 0.05);
            }

            playSound(type, task) {
                if (type === 'custom') {
                    this.playCustomSound(task);
                    return;
                }

                const ctx = this.getAudioContext();
                if (!ctx) return;

                switch (type) {
                    case 'hoera':  return this.playHoera(ctx);
                    case 'gelukt': return this.playGelukt(ctx);
                    case 'train':  return this.playTrain(ctx);
                    case 'pling':
                    default:       return this.playPling(ctx);
                }
            }

            playPling(ctx) {
                this.tone(ctx, { freq: 1318.5, duration: 0.16, gain: 0.16, type: 'sine' });
                this.tone(ctx, { freq: 1975.5, start: 0.07, duration: 0.42, gain: 0.11, type: 'sine' });
            }

            playHoera(ctx) {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, index) => {
                    this.tone(ctx, { freq, start: index * 0.085, duration: 0.3, gain: 0.15, type: 'triangle' });
                });
                this.tone(ctx, { freq: 1046.5, start: 0.36, duration: 0.6, gain: 0.13, type: 'sine' });
            }

            playGelukt(ctx) {
                [659.25, 783.99, 1046.5].forEach((freq, index) => {
                    this.tone(ctx, { freq, start: index * 0.11, duration: 0.26, gain: 0.15, type: 'sine' });
                });
                [523.25, 659.25, 783.99].forEach(freq => {
                    this.tone(ctx, { freq, start: 0.34, duration: 0.75, gain: 0.09, type: 'triangle' });
                });
            }

            playTrain(ctx) {
                // Two-tone horn plus a few chuffs.
                this.tone(ctx, { freq: 392, duration: 0.42, gain: 0.16, type: 'sawtooth' });
                this.tone(ctx, { freq: 294, duration: 0.42, gain: 0.13, type: 'sawtooth' });
                this.tone(ctx, { freq: 523, start: 0.34, duration: 0.5, gain: 0.14, type: 'sawtooth' });

                for (let i = 0; i < 4; i++) {
                    this.tone(ctx, {
                        freq: 150, start: 0.8 + i * 0.16, duration: 0.11,
                        gain: 0.09, type: 'square', sweepTo: 70
                    });
                }
            }

            playCustomSound(task) {
                if (!task || !task.customAudioId || !AudioStore.supported()) {
                    this.playSound('pling');
                    return;
                }

                AudioStore.get(task.customAudioId)
                    .then(blob => {
                        if (!blob) { this.playSound('pling'); return; }
                        const url = URL.createObjectURL(blob);
                        const audio = new Audio(url);
                        audio.addEventListener('ended', () => URL.revokeObjectURL(url));
                        audio.play().catch(() => {
                            URL.revokeObjectURL(url);
                            this.playSound('pling');
                        });
                    })
                    .catch(() => this.playSound('pling'));
            }

            // ================================================================
            // RENDER METHODS
            // ================================================================

            render() {
                const root = document.getElementById('app');
                root.innerHTML = this.mode === 'child' ? this.renderChildMode() : this.renderParentMode();

                if (this.justCompletedTaskId) {
                    const orb = root.querySelector(`[data-orb="${this.justCompletedTaskId}"]`);
                    if (orb) {
                        // Restart the animation on the freshly rendered node.
                        requestAnimationFrame(() => orb.classList.add('orb--pop'));
                    }
                    this.justCompletedTaskId = null;
                }
            }

            renderChildMode() {
                const part = this.activeDayPart;
                const tasks = this.tasks[part];
                const hasAnyTask = this.totalTaskCount() > 0;

                return `
                    ${this.renderSky()}
                    ${this.renderTabs()}
                    <main class="content">
                        ${hasAnyTask ? this.renderDayPartProgress(part) : ''}
                        ${hasAnyTask
                            ? (tasks.length > 0 ? this.renderTasksGrid(tasks) : this.renderEmptyDayPart(part))
                            : this.renderEmptyState()}
                    </main>
                    ${this.renderMiniTrain()}
                `;
            }

            renderSky() {
                const part = this.activeDayPart;
                const meta = DAY_PART_META[part];
                let deco = '';

                if (part === 'evening') {
                    const stars = Array.from({ length: 14 }, () => {
                        const top = 6 + Math.random() * 74;
                        const left = 2 + Math.random() * 78;
                        const delay = (Math.random() * 2.6).toFixed(2);
                        return `<i class="sky__star" style="top:${top}%;left:${left}%;animation-delay:${delay}s"></i>`;
                    }).join('');
                    deco = `<div class="sky__deco"><div class="sky__moon"></div>${stars}</div>`;
                } else {
                    deco = `
                        <div class="sky__deco">
                            <div class="sky__sun"></div>
                            <div class="sky__cloud" style="top:18%;left:-40px;width:78px;height:24px;animation-duration:30s"></div>
                            <div class="sky__cloud" style="top:52%;left:-80px;width:56px;height:18px;animation-duration:40s;animation-delay:-12s;opacity:.7"></div>
                        </div>`;
                }

                return `
                    <header class="sky sky--${part}">
                        ${deco}
                        <div class="sky__bar">
                            <div class="sky__avatar">${escapeHtml(this.profile.avatar)}</div>
                            <div class="sky__who">
                                <div class="sky__hello">${meta.greeting},</div>
                                <div class="sky__name">${escapeHtml(this.profile.name)}</div>
                            </div>
                            <button class="sky__gear" data-action="open-parent" aria-label="Ouder-modus openen">⚙️</button>
                        </div>
                    </header>
                `;
            }

            renderTabs() {
                return `
                    <nav class="tabs">
                        ${DAY_PARTS.map(part => {
                            const meta = DAY_PART_META[part];
                            const isActive = this.activeDayPart === part;
                            const count = this.tasks[part].length;
                            const done = count > 0 && this.isDayPartComplete(part);
                            return `
                                <button class="tab tab--${part} ${isActive ? 'is-active' : ''}"
